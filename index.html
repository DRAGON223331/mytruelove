<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>إلى اللقاء في موعد جديد 💙</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:#06143a;color:#fff;font-family:Tahoma,Arial,sans-serif}
h1{margin:0;font-size:clamp(32px,9vw,60px);line-height:1.6}
</style>
</head>
<body>
<h1>إلى اللقاء في موعد جديد 👋💙</h1>
<audio id="a" src="goodbye.mp3" loop preload="auto"></audio>
<script>
var a=document.getElementById('a');
function go(){if(!a.paused)return;var r=a.play();if(r&&r.catch)r.catch(function(){})}
go();
['click','touchend','pointerup','keydown'].forEach(function(n){document.addEventListener(n,go)});
</script>
</body>
</html>
